version: '3.8'

services:
  orb_slam3_jackal:
    build:
      context: .
      dockerfile: Dockerfile
    image: orb_slam3_jackal:humble
    container_name: orb_slam3_jackal
    
    # Enable GUI support
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    
    volumes:
      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
      # ============================================
      # PERSISTENT VOLUMES - Your work is saved here!
      # ============================================
      
      # Mount the source code so changes persist on your host
      - ./:/root/clearpath_ws/src/ros2_orb_slam3:rw
      
      # Persist the build/install folders (no rebuild every time!)
      - orb_slam3_build:/root/clearpath_ws/build:rw
      - orb_slam3_install:/root/clearpath_ws/install:rw
      - orb_slam3_log:/root/clearpath_ws/log:rw
      
      # Persist the ros2_test symlink directory (required by hardcoded path)
      - orb_slam3_ros2_test:/root/ros2_test:rw
      
      # Save trajectories, maps, and output data
      - ./data:/root/data:rw
      - ./data/output:/tmp:rw
      
      # Optional: Mount your host Clearpath simulation workspace
      # Uncomment if simulation runs on same machine
      # - ~/clearpath_ws:/root/host_clearpath_ws:ro
    
    # Network mode host for ROS2 DDS communication with simulation
    network_mode: host
    
    # GPU support for Pangolin visualization
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Keep container running and interactive
    stdin_open: true
    tty: true
    privileged: true
    
    command: bash

  # Optional: Standalone RViz service
  rviz:
    image: orb_slam3_jackal:humble
    container_name: orb_slam3_rviz
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - orb_slam3_install:/root/clearpath_ws/install:ro
      - ./config:/root/clearpath_ws/src/ros2_orb_slam3/config:ro
    
    network_mode: host
    
    command: >
      bash -c "source /opt/ros/humble/setup.bash && 
               source /root/clearpath_ws/install/setup.bash &&
               rviz2 -d /root/clearpath_ws/src/ros2_orb_slam3/config/orb_slam3.rviz"
    
    depends_on:
      - orb_slam3_jackal
    
    profiles:
      - viz

# ============================================
# Named volumes for data persistence
# These survive container restarts/rebuilds
# ============================================
volumes:
  orb_slam3_build:
    driver: local
  orb_slam3_install:
    driver: local
  orb_slam3_log:
    driver: local
  orb_slam3_ros2_test:
    driver: local
